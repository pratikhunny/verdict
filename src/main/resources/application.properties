# Verdict service — demo profile (in-memory, resettable). Postgres/Flyway arrive as an opt-in
# profile in phase 2b; the default run has no external dependency, so the stage demo cannot break
# on a database.
spring.application.name=verdict
server.port=8080
spring.jackson.serialization.indent-output=true
spring.mvc.problemdetails.enabled=true

# Document uploads (eBL / invoice / packing list). Text files for now; PDF is a fast-follow.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# --- AI extraction (L3), via Spring AI. Provider-agnostic: swap the starter in pom.xml to adopt a
# --- different backend model (OpenAI, Ollama, Bedrock, Vertex Gemini) and set its matching keys.
# The app boots WITHOUT a key: extraction defaults to fixtures, and live mode reports itself
# unavailable until a real key is set. Set ANTHROPIC_API_KEY to enable a live call on stage.
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:not-set}
spring.ai.anthropic.chat.options.model=${VERDICT_MODEL:claude-sonnet-4-5}
# Temperature 0 — extraction should be as stable as the backend allows.
spring.ai.anthropic.chat.options.temperature=0.0
